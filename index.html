<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR-паспорт оборудования</title>

  <!-- A-Frame рисует 3D-сцену, MindAR находит картинки-маркеры на кадрах камеры -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* браузер не листает и не масштабирует страницу пальцами: жесты достаются объекту */
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; touch-action: none; }

    #status {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      padding: 14px; text-align: center; font-size: 17px;
      color: white; background: rgba(0, 0, 0, 0.65);
    }

    /* панель с данными: остаётся на экране после распознавания */
    #panel {
      position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 10;
      max-width: 520px; margin: 0 auto; display: none;
      background: white; border-radius: 12px; overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }
    #panel-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; color: white; font-weight: bold; font-size: 17px;
    }
    #panel-close {
      border: none; background: rgba(255, 255, 255, 0.25); color: white;
      font-size: 18px; width: 32px; height: 32px; border-radius: 16px;
      cursor: pointer; flex-shrink: 0; margin-left: 10px;
    }
    #panel-body { padding: 10px 14px; font-size: 15px; line-height: 1.6; }
    #panel-body b { color: #555; font-weight: normal; }
    #panel-hint { padding: 0 14px 8px; font-size: 13px; color: #777; }
    #history { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 12px; }
    #history button {
      border: 1px solid #ccc; background: #f4f4f4; border-radius: 14px;
      padding: 5px 10px; font-size: 13px; cursor: pointer;
    }
    #history button.active { background: #333; color: white; border-color: #333; }
  </style>
</head>
<body>
  <div id="status">Наведите камеру на маркер оборудования</div>

  <div id="panel">
    <div id="panel-head">
      <span id="panel-title"></span>
      <button id="panel-close" title="Закрыть">✕</button>
    </div>
    <div id="panel-body"></div>
    <div id="panel-hint">Один палец — сдвинуть модель, два пальца — изменить размер</div>
    <div id="history"></div>
  </div>

  <!-- AR-сцена: маркеры берутся из файла targets.mind (собирается на странице compile.html) -->
  <a-scene mindar-image="imageTargetSrc: targets.mind; maxTrack: 1; uiScanning: no"
           xr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
           renderer="antialias: true; colorManagement: true">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Подставка: стоит там, где последний найденный маркер, и остаётся, когда маркер пропал.
         У MindAR маркер лежит в плоскости XY, ось Z направлена к камере. Модели построены
         с осью Y «вверх», поэтому каждая повёрнута на 90° вокруг X и встаёт над картинкой. -->
    <a-entity id="holder">

      <!-- Модель 1: токарный станок -->
      <a-entity id="model-lathe" visible="false">
        <a-entity rotation="90 0 0">
          <a-box position="0 0.1 0" width="1" height="0.2" depth="0.4" color="#4a5a6a"></a-box>
          <a-box position="-0.37 0.35 0" width="0.26" height="0.3" depth="0.4" color="#2f3b47"></a-box>
          <a-cylinder position="-0.19 0.35 0" rotation="0 0 90" radius="0.12" height="0.08" color="#9aa3ab"></a-cylinder>
          <a-cylinder position="0.06 0.35 0" rotation="0 0 90" radius="0.05" height="0.42" color="#c9a227"></a-cylinder>
          <a-box position="0.38 0.32 0" width="0.16" height="0.24" depth="0.3" color="#2f3b47"></a-box>
          <a-sphere class="lamp" position="-0.37 0.57 0" radius="0.07"></a-sphere>
          <a-plane class="card" position="0 0.01 -1.2" rotation="-90 0 0" width="2" height="1.25"></a-plane>
        </a-entity>
      </a-entity>

      <!-- Модель 2: фрезерный станок с ЧПУ -->
      <a-entity id="model-mill" visible="false">
        <a-entity rotation="90 0 0">
          <a-box position="0 0.08 0" width="0.9" height="0.16" depth="0.5" color="#4a5a6a"></a-box>
          <a-box position="0 0.4 -0.2" width="0.34" height="0.64" depth="0.16" color="#2f3b47"></a-box>
          <a-box position="0 0.6 -0.02" width="0.26" height="0.2" depth="0.28" color="#2f3b47"></a-box>
          <a-cylinder position="0 0.42 0.04" radius="0.04" height="0.16" color="#9aa3ab"></a-cylinder>
          <a-box position="0 0.2 0.05" width="0.3" height="0.08" depth="0.2" color="#c9a227"></a-box>
          <a-sphere class="lamp" position="0 0.79 -0.2" radius="0.07"></a-sphere>
          <a-plane class="card" position="0 0.01 -1.2" rotation="-90 0 0" width="2" height="1.25"></a-plane>
        </a-entity>
      </a-entity>

      <!-- Модель 3: 3D-принтер -->
      <a-entity id="model-printer" visible="false">
        <a-entity rotation="90 0 0">
          <a-box position="0 0.4 0" width="0.8" height="0.8" depth="0.8" material="color: #2f3b47; wireframe: true"></a-box>
          <a-box position="0 0.15 0" width="0.7" height="0.03" depth="0.7" color="#4a5a6a"></a-box>
          <a-cylinder position="0 0.24 0" radius="0.12" height="0.15" color="#c9a227"></a-cylinder>
          <a-box position="0 0.5 0" width="0.14" height="0.1" depth="0.14" color="#9aa3ab"></a-box>
          <a-sphere class="lamp" position="0.32 0.87 -0.32" radius="0.07"></a-sphere>
          <a-plane class="card" position="0 0.01 -1.2" rotation="-90 0 0" width="2" height="1.25"></a-plane>
        </a-entity>
      </a-entity>
    </a-entity>

    <!-- Маркеры только распознают картинки: targetIndex — номер картинки в targets.mind -->
    <a-entity id="target-lathe" mindar-image-target="targetIndex: 0"></a-entity>
    <a-entity id="target-mill" mindar-image-target="targetIndex: 1"></a-entity>
    <a-entity id="target-printer" mindar-image-target="targetIndex: 2"></a-entity>
  </a-scene>

  <script>
    const IDS = ["lathe", "mill", "printer"]; // порядок = targetIndex 0, 1, 2

    const STATE = {
      ok:     { text: "Исправен",     color: "#2e9e4f" },
      due:    { text: "Требуется ТО", color: "#e08a00" },
      repair: { text: "На ремонте",   color: "#d33a2c" }
    };

    // "2026-11-02" -> "02.11.2026"
    function formatDate(iso) {
      if (!iso) return "после ремонта";
      const [y, m, d] = iso.split("-");
      return d + "." + m + "." + y;
    }

    // состояние вычисляется по данным: ремонт или просроченное ТО
    function stateOf(m) {
      if (m.repair) return STATE.repair;
      const today = new Date().toISOString().slice(0, 10);
      if (m.nextTO && m.nextTO < today) return STATE.due;
      return STATE.ok;
    }

    // карточка для 3D-сцены рисуется на холсте: шрифт A-Frame не знает кириллицы
    function makeCard(m, st) {
      const canvas = document.createElement("canvas");
      canvas.width = 640;
      canvas.height = 400;
      const ctx = canvas.getContext("2d");
      const maxW = 600; // длинные строки сжимаются, а не обрезаются

      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, 640, 400);
      ctx.fillStyle = st.color;
      ctx.fillRect(0, 0, 640, 76);

      ctx.fillStyle = "white";
      ctx.font = "bold 30px Arial";
      ctx.fillText(m.name, 20, 50, maxW);

      const lines = [
        "Инвентарный номер: " + m.inv,
        "Состояние: " + st.text,
        "Последнее ТО: " + formatDate(m.lastTO),
        "Следующее ТО: " + formatDate(m.nextTO),
        "Ответственный: " + m.person,
        "Внимание: " + m.note
      ];
      ctx.fillStyle = "black";
      ctx.font = "27px Arial";
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], 20, 122 + i * 50, maxW);
      }
      return canvas.toDataURL();
    }

    const statusBar = document.getElementById("status");
    const holder = document.getElementById("holder");
    let machines = {};
    let activeTarget = null;  // маркер, за которым сейчас следует подставка
    let current = null;       // id оборудования, которое показано
    let model = null;         // его 3D-модель
    const scanned = [];       // всё оборудование, отсканированное за сеанс

    function setStatus(text) { statusBar.textContent = text; }

    // показать модель и панель выбранного оборудования
    function showMachine(id) {
      const m = machines[id];
      const st = stateOf(m);

      if (model) model.object3D.visible = false;
      model = document.getElementById("model-" + id);
      model.object3D.visible = true;
      current = id;
      if (!scanned.includes(id)) scanned.push(id);

      document.getElementById("panel-head").style.background = st.color;
      document.getElementById("panel-title").textContent = m.name;

      const body = document.getElementById("panel-body");
      body.textContent = "";
      const rows = [
        ["Инвентарный номер", m.inv],
        ["Состояние", st.text],
        ["Последнее ТО", formatDate(m.lastTO)],
        ["Следующее ТО", formatDate(m.nextTO)],
        ["Ответственный", m.person],
        ["Внимание", m.note]
      ];
      for (const [label, value] of rows) {
        const div = document.createElement("div");
        const b = document.createElement("b");
        b.textContent = label + ": ";
        div.append(b, value);
        body.append(div);
      }

      // кнопки для переключения между уже отсканированным оборудованием
      const history = document.getElementById("history");
      history.textContent = "";
      if (scanned.length > 1) {
        for (const sid of scanned) {
          const btn = document.createElement("button");
          btn.textContent = machines[sid].name;
          if (sid === id) btn.className = "active";
          btn.onclick = () => showMachine(sid);
          history.append(btn);
        }
      }
      document.getElementById("panel").style.display = "block";
    }

    document.getElementById("panel-close").onclick = () => {
      document.getElementById("panel").style.display = "none";
      if (model) model.object3D.visible = false;
      model = null;
      current = null;
      activeTarget = null;
      setStatus("Наведите камеру на маркер оборудования");
    };

    function setup() {
      for (const id of IDS) {
        const m = machines[id];
        const st = stateOf(m);
        const box = document.getElementById("model-" + id);

        // карточка с данными и пульсирующая сфера цвета состояния
        box.querySelector(".card").setAttribute("material", { shader: "flat", src: makeCard(m, st) });
        const lamp = box.querySelector(".lamp");
        lamp.setAttribute("color", st.color);
        lamp.setAttribute("animation", {
          property: "scale", to: "1.4 1.4 1.4", dir: "alternate", loop: true, dur: 700
        });

        // маркер найден: подставка начинает следовать за ним, показываются его модель и данные
        const target = document.getElementById("target-" + id);
        target.addEventListener("targetFound", () => {
          activeTarget = target;
          showMachine(id);
          setStatus("Распознан маркер: " + m.name);
        });
        // маркер пропал: подставка остаётся на месте, данные не пропадают
        target.addEventListener("targetLost", () => {
          if (activeTarget === target) setStatus("Маркер вне кадра, модель закреплена");
        });
      }
    }

    // положение подставки задаём сами, поэтому выключаем его автоматический пересчёт
    holder.object3D.matrixAutoUpdate = false;

    // каждый кадр: пока маркер виден, ставим подставку туда же, где он
    function followMarker() {
      if (activeTarget && activeTarget.object3D.visible) {
        holder.object3D.matrix.copy(activeTarget.object3D.matrix);
      }
      requestAnimationFrame(followMarker);
    }
    followMarker();

    // жесты: один палец сдвигает модель, два пальца меняют её размер
    let lastX, lastY, startDistance, startScale;

    function fingersDistance(e) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function rememberStart(e) {
      if (!model) return;
      if (e.touches.length === 1) {
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      }
      if (e.touches.length === 2) {
        startDistance = fingersDistance(e);
        startScale = model.object3D.scale.x;
      }
    }
    document.addEventListener("touchstart", rememberStart);
    document.addEventListener("touchend", rememberStart);

    document.addEventListener("touchmove", (e) => {
      if (!model || e.target.closest("#panel")) return; // по панели жесты не работают
      if (e.touches.length === 1) {
        model.object3D.position.x += (e.touches[0].clientX - lastX) / 300;
        model.object3D.position.y -= (e.touches[0].clientY - lastY) / 300;
        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;
      }
      if (e.touches.length === 2) {
        const scale = Math.min(5, Math.max(0.2, startScale * fingersDistance(e) / startDistance));
        model.object3D.scale.set(scale, scale, scale);
      }
    });

    // ошибки запуска: камера не дана или нет файла маркеров
    const scene = document.querySelector("a-scene");
    scene.addEventListener("arError", () => {
      setStatus("Камера недоступна: разрешите доступ к камере и откройте сайт по https");
    });
    fetch("targets.mind", { method: "HEAD" }).then((r) => {
      if (!r.ok) setStatus("Нет файла targets.mind: соберите его на странице compile.html");
    });

    // данные хранятся отдельно от кода и загружаются при открытии страницы
    fetch("machines.json", { cache: "no-store" })
      .then((r) => r.json())
      .then((data) => {
        machines = data;
        if (scene.hasLoaded) setup();
        else scene.addEventListener("loaded", setup);
      })
      .catch(() => {
        setStatus("Не удалось загрузить machines.json. Откройте страницу через сервер, а не двойным щелчком");
      });
  </script>
</body>
</html>
